name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install uv==0.11.7

      - name: Install locked CPU dependencies
        run: uv pip sync --system --require-hashes --torch-backend cpu training/requirements-ci.lock

      - name: Run Python tests
        run: python -m pytest -q

  viewer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json

      - name: Install viewer dependencies
        working-directory: apps/viewer
        run: npm ci

      - name: Test viewer
        working-directory: apps/viewer
        run: npm test

      - name: Typecheck viewer
        working-directory: apps/viewer
        run: npm run typecheck

      - name: Build viewer
        working-directory: apps/viewer
        run: npm run build
